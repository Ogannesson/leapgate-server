[package]
name = "leapgate-server"
version = "1.1.17"
authors = ["rustdesk <info@rustdesk.com>"]
edition = "2021"
build = "build.rs"
default-run = "leapgate-server"

[[bin]]
name = "hbbr"
path = "src/hbbr.rs"

[[bin]]
name = "rustdesk-utils"
path = "src/utils.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hbb_common = { path = "libs/hbb_common" }
serde_derive = "1.0"
serde = "1.0"
serde_json = { version = "1.0", features = ["raw_value"] }
lazy_static = "1.4"
clap = "2"
rust-ini = "0.18"
base64 = "0.13"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive", "macros", "migrate"] }
async-trait = "0.1"
async-speed-limit = { git = "https://github.com/open-trade/async-speed-limit" }
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
once_cell = "1.8"
sodiumoxide = "0.2"
tempfile = "3"
# Same copy as hbb_common's, so the WebSocket listeners and hbb_common share one stack.
tokio-tungstenite = { git = "https://github.com/rustdesk-org/tokio-tungstenite", rev = "c241b11b03de4881faf1ecd2fe6e867c92f3013b", version = "0.29" }
tungstenite = "0.29"
flexi_logger = { version = "0.22", features = ["async", "use_chrono_for_offset", "dont_minimize_extra_stacks"] }
ipnetwork = "0.20"
local-ip-address = "0.5.1"
dns-lookup = "1.0.8"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
# The API port's own accept loop (src/api/listen.rs): the same copies and features axum already
# builds, so nothing new is compiled.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
# argon2 0.5 / md-5 0.10 / sha2 0.10 share hbb_common's digest 0.10 stack.
argon2 = "0.5.3"
bcrypt = "0.19.3"
md-5 = "0.10.6"
sha2 = "0.10"
maxminddb = { version = "0.32.0", features = ["mmap"] }
# Same major as hbb_common's, so no second copy is built.
toml = "0.7"
flate2 = "1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# https://github.com/rustdesk/rustdesk-server-pro/issues/189, using native-tls for better tls support
reqwest = { git = "https://github.com/rustdesk-org/reqwest", features = ["blocking", "socks", "json", "native-tls", "gzip"], default-features=false }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
reqwest = { git = "https://github.com/rustdesk-org/reqwest", features = ["blocking", "socks", "json", "rustls-tls", "rustls-tls-native-roots", "gzip"], default-features=false }

[build-dependencies]
hbb_common = { path = "libs/hbb_common" }

[workspace]
members = ["libs/hbb_common"]
exclude = ["ui"]

# Same patch as the RustDesk client's root Cargo.toml (hbb_common's own [patch] only applies when it
# is built alone): upstream tungstenite reserves a frame's whole declared length as soon as its header
# is in; this fork grows the buffer as the bytes arrive. Patched rather than depended on directly, so
# tokio-tungstenite's own tungstenite resolves to the same copy.
[patch.crates-io]
tungstenite = { git = "https://github.com/rustdesk-org/tungstenite-rs", rev = "efce47e5364f00a63302cf07ab1fb13ded478914" }

#https://github.com/johnthagen/min-sized-rust
#https://doc.rust-lang.org/cargo/reference/profiles.html#default-profiles
[profile.release]
lto = true
codegen-units = 1
# Unwind (not abort) so a panicking task or HTTP handler does not take the whole server down.
strip = true
#opt-level = 'z' # only have smaller size after strip # Default is 3, better performance
#rpath = true # Not needed
